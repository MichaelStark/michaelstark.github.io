<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реестр чек-листов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --badge-amber: #f59e0b;
            --badge-pink: #ec4899;
            --badge-indigo: #6366f1;
            --badge-emerald: #10b981;
            --badge-cyan: #06b6d4;
            --badge-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Stable scrollbar prevents any horizontal page jumps */
        html {
            scrollbar-gutter: stable;
            overflow-y: scroll;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 0 20px 40px 20px;
            min-height: 100vh;
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        /* Sticky Control Center (Pinned at top, content scrolls below) */
        .sticky-dashboard {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-color);
            padding-top: 16px;
            padding-bottom: 12px;
            box-shadow: 0 10px 20px -10px rgba(15, 23, 42, 0.9);
        }

        /* Fixed-height Header */
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            min-height: 94px;
        }

        .header-info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        h1 { 
            font-size: 1.35rem; 
            font-weight: 700; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            line-height: 1.2;
            min-height: 1.2em;
        }

        .subtitle { 
            color: var(--text-secondary); 
            margin-top: 4px; 
            font-size: 0.88rem; 
            line-height: 1.35; 
            min-height: 2.7em; 
            display: flex;
            align-items: flex-start;
        }

        #header-action {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .btn-action {
            background: #2563eb;
            color: #fff;
            border: 1px solid #3b82f6;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            white-space: nowrap;
        }

        .btn-action:hover { background: #1d4ed8; }

        .btn-disconnect {
            background: rgba(248, 113, 113, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-disconnect:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: #f87171;
            color: #fff;
        }

        /* Full Path Badge with Green Border */
        .status-badge {
            font-size: 0.82rem;
            color: #4ade80;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(74, 222, 128, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(74, 222, 128, 0.5);
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.08);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* Responsive Grid for Tabs */
        .tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            text-align: left;
            min-height: 44px;
        }

        .tab-btn:hover {
            background-color: #334155;
            color: #fff;
            border-color: #475569;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 4px 12px 0 rgba(37, 99, 235, 0.35);
        }

        .tab-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab-count {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* Fixed-height Progress Card */
        .progress-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
            min-height: 64px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            min-height: 1.3em;
        }

        .progress-bar-bg {
            background-color: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #4ade80);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Filter Chips Bar (Zero shifts) */
        .controls-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 36px;
        }

        .filter-group { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            align-items: center; 
        }

        /* Equal-Height Filter Chips with constant font-weight */
        .filter-chip {
            background-color: #1e293b;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0 14px;
            height: 36px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-sizing: border-box;
            line-height: 1;
            user-select: none;
            flex-shrink: 0;
        }

        .filter-chip:hover {
            background-color: #334155;
            color: #fff;
            border-color: #475569;
        }

        .filter-chip.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.35);
        }

        /* Content Area (Scrolls smoothly below sticky panel) */
        #content-area {
            margin-top: 14px;
        }

        /* Sections */
        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .section-header {
            padding: 14px 20px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title { font-size: 1.05rem; font-weight: 600; }
        .section-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; background-color: #334155; color: #cbd5e1; }

        .items-list { padding: 4px 0; }

        .item-row {
            padding: 14px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            transition: background-color 0.15s ease;
        }

        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background-color: rgba(255, 255, 255, 0.02); }
        .item-row.completed { background-color: rgba(74, 222, 128, 0.04); }
        .item-row.completed .item-name { text-decoration: line-through; color: #64748b; }

        .custom-checkbox {
            margin-top: 3px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #38bdf8;
            flex-shrink: 0;
        }

        .item-body { flex-grow: 1; }

        .item-top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .item-name { font-weight: 600; font-size: 0.98rem; color: var(--text-primary); }

        /* Badges / Hashtag Pills */
        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-orig { background-color: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
        .badge-copy { background-color: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
        .badge-update { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-urgent { background-color: rgba(248, 113, 113, 0.2); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.4); }
        .badge-custom-cyan { background-color: rgba(6, 182, 212, 0.2); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4); }
        .badge-custom-emerald { background-color: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-custom-purple { background-color: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4); }

        .item-desc { color: var(--text-secondary); font-size: 0.875rem; margin-top: 4px; }
        .item-subtext {
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 6px;
            font-size: 0.82rem;
            color: #cbd5e1;
            border-left: 2px solid #38bdf8;
        }

        .empty-state {
            background-color: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
        }

        .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; color: #fff; }
        .empty-state p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 20px; }

        .no-matches {
            background-color: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 36px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sticky Fixed Control Center -->
        <div class="sticky-dashboard">
            <header>
                <div class="header-info">
                    <h1 id="main-title">Реестр документов</h1>
                    <p class="subtitle" id="main-subtitle"></p>
                </div>
                <div id="header-action"></div>
            </header>

            <div class="tabs" id="tabs-container" style="display:none"></div>

            <div class="progress-card" id="progress-card" style="display:none">
                <div class="progress-header">
                    <span id="progress-label">Готовность</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div class="controls-bar" id="controls-bar" style="display:none">
                <div class="filter-group" id="filter-group-container"></div>
            </div>
        </div>

        <!-- Scrollable Document Module -->
        <div id="content-area">
            <div class="empty-state" id="empty-prompt">
                <h3>Подключение рабочей папки</h3>
                <p>Нажмите кнопку ниже и выберите рабочую папку. Движок автоматически просканирует подпапки на наличие списков документов.</p>
                <button class="btn-action" style="margin:0 auto" onclick="requestFolderAccess()">
                    <span>Выбрать рабочую папку</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = "ChecklistEngineDB";
        const STORE_NAME = "workspace_handles";

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => {
                    req.result.createObjectStore(STORE_NAME);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveHandle(key, handle) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put(handle, key);
            } catch (e) {
                console.error("IndexedDB save error:", e);
            }
        }

        async function getHandle(key) {
            try {
                const db = await openDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, "readonly");
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        }

        async function clearHandle(key) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).delete(key);
            } catch (e) {
                console.error("IndexedDB delete error:", e);
            }
        }

        function getDisplayPath(dirHandle) {
            if (window.location.protocol === "file:") {
                try {
                    let path = decodeURIComponent(window.location.pathname);
                    if (path.startsWith("/") && path.length > 2 && path[2] === ":") {
                        path = path.substring(1);
                    }
                    const lastSlash = path.lastIndexOf("/");
                    if (lastSlash !== -1) {
                        path = path.substring(0, lastSlash);
                    }
                    return path.replace(/\//g, "\\");
                } catch (e) {}
            }
            return dirHandle ? ("/" + dirHandle.name) : "Pobyt";
        }

        let rootDirectoryHandle = null;
        let applicantsData = {};
        let currentApplicantKey = null;
        let activeFilters = new Set(); // Multi-select filters (empty means "Все")
        let globalAllTags = [];        // Global pool of all tags across all markdown files

        async function requestFolderAccess() {
            try {
                if (window.showDirectoryPicker) {
                    const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
                    rootDirectoryHandle = dirHandle;
                    await saveHandle("last_folder", dirHandle);
                    await scanAndLoadDirectory(dirHandle);
                } else {
                    alert("Ваш браузер не поддерживает File System Access API. Рекомендуется Chrome или Edge.");
                }
            } catch (err) {
                console.log("Выбор папки отменен:", err);
            }
        }

        async function restoreSavedAccess() {
            if (rootDirectoryHandle) {
                const perm = await rootDirectoryHandle.requestPermission({ mode: "readwrite" });
                if (perm === "granted") {
                    await scanAndLoadDirectory(rootDirectoryHandle);
                }
            }
        }

        async function disconnectFolder() {
            await clearHandle("last_folder");
            localStorage.removeItem("active_tab");
            rootDirectoryHandle = null;
            applicantsData = {};
            currentApplicantKey = null;
            activeFilters.clear();
            globalAllTags = [];

            document.getElementById("main-title").innerText = "Реестр документов";
            document.getElementById("main-subtitle").innerText = "";
            document.getElementById("tabs-container").style.display = "none";
            document.getElementById("progress-card").style.display = "none";
            document.getElementById("controls-bar").style.display = "none";
            document.getElementById("header-action").innerHTML = "";
            document.getElementById("content-area").innerHTML = `
                <div class="empty-state" id="empty-prompt">
                    <h3>Подключение рабочей папки</h3>
                    <p>Нажмите кнопку ниже и выберите рабочую папку. Движок автоматически просканирует подпапки на наличие списков документов.</p>
                    <button class="btn-action" style="margin:0 auto" onclick="requestFolderAccess()">
                        <span>Выбрать рабочую папку</span>
                    </button>
                </div>
            `;
        }

        async function scanAndLoadDirectory(dirHandle) {
            applicantsData = {};
            const globalTagsSet = new Set();

            // 1. Root checklist.md if exists
            try {
                const rootFileHandle = await dirHandle.getFileHandle("checklist.md", { create: false });
                const file = await rootFileHandle.getFile();
                const text = await file.text();
                const parsed = parseMarkdown(text);
                applicantsData["_root"] = {
                    key: "_root",
                    title: parsed.title || dirHandle.name,
                    subtitle: parsed.subtitle || "",
                    fileHandle: rootFileHandle,
                    rawMarkdown: text,
                    sections: parsed.sections,
                    allTags: parsed.allTags
                };
                parsed.allTags.forEach(t => globalTagsSet.add(t));
            } catch (e) {}

            // 2. All non-hidden subfolders (depth 1)
            for await (const entry of dirHandle.values()) {
                if (entry.kind === "directory" && !entry.name.startsWith(".")) {
                    try {
                        const fileHandle = await entry.getFileHandle("checklist.md", { create: false });
                        const file = await fileHandle.getFile();
                        const text = await file.text();
                        const parsed = parseMarkdown(text);

                        applicantsData[entry.name] = {
                            key: entry.name,
                            title: parsed.title || entry.name,
                            subtitle: parsed.subtitle || "",
                            fileHandle: fileHandle,
                            rawMarkdown: text,
                            sections: parsed.sections,
                            allTags: parsed.allTags
                        };
                        parsed.allTags.forEach(t => globalTagsSet.add(t));
                    } catch (e) {}
                }
            }

            globalAllTags = Array.from(globalTagsSet);

            const keys = Object.keys(applicantsData);
            if (keys.length > 0) {
                document.getElementById("empty-prompt") && (document.getElementById("empty-prompt").style.display = "none");
                document.getElementById("tabs-container").style.display = "grid";
                document.getElementById("progress-card").style.display = "block";
                document.getElementById("controls-bar").style.display = "flex";

                const fullPath = getDisplayPath(dirHandle);
                document.getElementById("header-action").innerHTML = `
                    <div class="status-badge" title="${fullPath}">
                        <span>📂</span>
                        <span>${fullPath}</span>
                    </div>
                    <button class="btn-disconnect" onclick="disconnectFolder()" title="Очистить память и выбрать другую папку">
                        <span>✕</span>
                        <span>Отвязать папку</span>
                    </button>
                `;

                const savedTab = localStorage.getItem("active_tab");
                currentApplicantKey = (savedTab && applicantsData[savedTab]) ? savedTab : keys[0];

                renderTabs();
                renderCurrentApplicant();
            } else {
                alert("В выбранной папке не найдены файлы checklist.md.");
            }
        }

        // Hashtag styling palette
        function getBadgeClassForTag(tag) {
            const lower = tag.toLowerCase();
            if (lower === "оригинал" || lower === "original" || lower === "wgląd") return "badge-orig";
            if (lower === "копия" || lower === "kopia" || lower === "copy") return "badge-copy";
            if (lower === "актуализация" || lower === "aktualizacja" || lower === "update") return "badge-update";
            if (lower === "срочно" || lower === "urgent" || lower === "pilne") return "badge-urgent";

            // Hash fallback for custom tags
            const colors = ["badge-custom-cyan", "badge-custom-emerald", "badge-custom-purple"];
            let hash = 0;
            for (let i = 0; i < tag.length; i++) hash += tag.charCodeAt(i);
            return colors[Math.abs(hash) % colors.length];
        }

        function stripOuterParentheses(str) {
            if (!str) return "";
            str = str.trim();
            if (!str.startsWith("(") || !str.endsWith(")")) return str;

            let depth = 0;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '(') depth++;
                else if (str[i] === ')') depth--;

                // If depth drops to 0 before the last character, the outer parens do not enclose the entire string
                // Example: "(школа) (с печатью)" -> depth becomes 0 at index 6, so do NOT strip
                if (depth === 0 && i < str.length - 1) {
                    return str;
                }
            }

            if (depth === 0) {
                return str.slice(1, -1).trim();
            }
            return str;
        }

        function parseMarkdown(mdText) {
            const lines = mdText.split(/\r?\n/);
            const sections = [];
            let currentSection = { title: "Документы", items: [] };
            let title = "";
            let subtitle = "";
            const allTagsSet = new Set();

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith("# ") && !title) {
                    title = line.replace("# ", "").trim();
                    continue;
                }
                if ((line.startsWith("**") || line.startsWith("> ") || line.startsWith("Статус:")) && !subtitle && !line.startsWith("- ")) {
                    subtitle = line.replace(/\*\*/g, "").replace(/^>\s*/, "").trim();
                    continue;
                }
                if (line.startsWith("### ") || line.startsWith("## ")) {
                    if (currentSection.items.length > 0) {
                        sections.push(currentSection);
                    }
                    currentSection = {
                        title: line.replace(/^#+\s*/, "").trim(),
                        items: []
                    };
                    continue;
                }

                const match = line.match(/^(\s*)-\s*\[([ xX])\]\s*(.*)$/);
                if (match) {
                    const isChecked = match[2].toLowerCase() === 'x';
                    let fullText = match[3].trim();

                    // 1. Extract all explicit #hashtags from line
                    const tags = [];
                    const badges = [];
                    const tagMatches = fullText.match(/(?:^|\s)#([a-zA-Z0-9а-яА-ЯёЁ_\-]+)/g);
                    if (tagMatches) {
                        tagMatches.forEach(rawTag => {
                            const cleanTag = rawTag.trim().replace(/^#/, "");
                            if (cleanTag && !tags.includes(cleanTag.toLowerCase())) {
                                const tagLower = cleanTag.toLowerCase();
                                tags.push(tagLower);
                                allTagsSet.add(cleanTag);
                                badges.push({
                                    text: cleanTag.toUpperCase(),
                                    class: getBadgeClassForTag(cleanTag)
                                });
                            }
                        });
                        // Remove hashtags from readable line text
                        fullText = fullText.replace(/(?:^|\s)#[a-zA-Z0-9а-яА-ЯёЁ_\-]+/g, " ").replace(/\s{2,}/g, " ").trim();
                    }

                    let name = fullText;
                    let desc = "";
                    const boldMatch = fullText.match(/^\*\*(.*?)\*\*(.*)$/);
                    if (boldMatch) {
                        name = boldMatch[1].trim();
                        desc = stripOuterParentheses(boldMatch[2].trim().replace(/^[\-:]\s*/, ""));
                    }

                    const item = {
                        lineIndex: i,
                        isChecked,
                        name,
                        desc,
                        badges,
                        tags,
                        sublines: []
                    };

                    while (i + 1 < lines.length && lines[i + 1].match(/^\s{2,}-\s+/)) {
                        i++;
                        item.sublines.push(lines[i].replace(/^\s+-\s+/, "").trim());
                    }

                    currentSection.items.push(item);
                }
            }

            if (currentSection.items.length > 0) {
                sections.push(currentSection);
            }

            return { title, subtitle, sections, allTags: Array.from(allTagsSet) };
        }

        function renderTabs() {
            const container = document.getElementById("tabs-container");
            container.innerHTML = "";

            Object.keys(applicantsData).forEach(key => {
                const app = applicantsData[key];
                let total = 0, done = 0;
                app.sections.forEach(s => {
                    s.items.forEach(i => {
                        total++;
                        if (i.isChecked) done++;
                    });
                });

                const btn = document.createElement("button");
                btn.className = `tab-btn ${key === currentApplicantKey ? "active" : ""}`;
                btn.onclick = () => switchApplicant(key);
                btn.innerHTML = `
                    <div class="tab-label">
                        <span>${app.title}</span>
                    </div>
                    <span class="tab-count">${done}/${total}</span>
                `;
                container.appendChild(btn);
            });
        }

        function switchApplicant(key) {
            currentApplicantKey = key;
            localStorage.setItem("active_tab", key);
            // Persistent filters: do not clear, preserve user selection across tabs
            renderTabs();
            renderCurrentApplicant();
        }

        // Multi-select Filter Handler
        function toggleFilter(filterKey) {
            if (filterKey === "all") {
                activeFilters.clear();
            } else {
                if (activeFilters.has(filterKey)) {
                    activeFilters.delete(filterKey);
                } else {
                    if (filterKey === "uncompleted") activeFilters.delete("completed");
                    if (filterKey === "completed") activeFilters.delete("uncompleted");
                    activeFilters.add(filterKey);
                }
            }
            renderCurrentApplicant();
        }

        function renderFilterChips() {
            const container = document.getElementById("filter-group-container");
            if (!container) return;

            const isAll = activeFilters.size === 0;
            let html = `
                <button class="filter-chip ${isAll ? 'active' : ''}" onclick="toggleFilter('all')">Все</button>
            `;

            // Stable Global Pool of all distinct hashtags across the entire workspace
            globalAllTags.forEach(tag => {
                const tagLower = tag.toLowerCase();
                const isActive = activeFilters.has(tagLower);
                html += `
                    <button class="filter-chip ${isActive ? 'active' : ''}" onclick="toggleFilter('${tagLower}')">
                        <span>🏷️ #${tag}</span>
                    </button>
                `;
            });

            const isUncompleted = activeFilters.has("uncompleted");
            const isCompleted = activeFilters.has("completed");

            html += `
                <button class="filter-chip ${isUncompleted ? 'active' : ''}" onclick="toggleFilter('uncompleted')">⏳ Не готово</button>
                <button class="filter-chip ${isCompleted ? 'active' : ''}" onclick="toggleFilter('completed')">✅ Готово</button>
            `;

            container.innerHTML = html;
        }

        async function toggleItem(lineIndex, checkbox) {
            if (!currentApplicantKey || !applicantsData[currentApplicantKey]) return;
            const app = applicantsData[currentApplicantKey];
            const lines = app.rawMarkdown.split(/\r?\n/);

            if (lines[lineIndex]) {
                if (checkbox.checked) {
                    lines[lineIndex] = lines[lineIndex].replace(/-\s*\[\s*\]/, "- [x]");
                } else {
                    lines[lineIndex] = lines[lineIndex].replace(/-\s*\[[xX]\]/, "- [ ]");
                }
                app.rawMarkdown = lines.join("\n");

                if (app.fileHandle) {
                    try {
                        const writable = await app.fileHandle.createWritable();
                        await writable.write(app.rawMarkdown);
                        await writable.close();
                    } catch (err) {
                        console.error("Ошибка записи файла:", err);
                    }
                }

                const parsed = parseMarkdown(app.rawMarkdown);
                app.sections = parsed.sections;
                app.allTags = parsed.allTags;
                renderTabs();
                renderCurrentApplicant();
            }
        }

        function renderCurrentApplicant() {
            if (!currentApplicantKey || !applicantsData[currentApplicantKey]) return;
            const app = applicantsData[currentApplicantKey];

            document.getElementById("main-title").innerText = app.title || "Реестр документов";
            document.getElementById("main-subtitle").innerText = app.subtitle || "";

            // Render persistent global filter chips
            renderFilterChips();

            const container = document.getElementById("content-area");
            container.innerHTML = "";

            let totalItems = 0;
            let totalDone = 0;
            let totalRenderedSections = 0;

            const selectedTags = Array.from(activeFilters).filter(f => f !== "uncompleted" && f !== "completed");
            const hasUncompleted = activeFilters.has("uncompleted");
            const hasCompleted = activeFilters.has("completed");

            app.sections.forEach((section, sIdx) => {
                const filtered = section.items.filter(item => {
                    totalItems++;
                    if (item.isChecked) totalDone++;

                    if (activeFilters.size === 0) return true;

                    if (hasUncompleted && item.isChecked) return false;
                    if (hasCompleted && !item.isChecked) return false;

                    if (selectedTags.length > 0) {
                        const hasMatchingTag = selectedTags.some(t => item.tags.includes(t));
                        if (!hasMatchingTag) return false;
                    }

                    return true;
                });

                if (filtered.length === 0 && activeFilters.size > 0) return;

                totalRenderedSections++;
                const completedInSection = section.items.filter(i => i.isChecked).length;

                const secCard = document.createElement("div");
                secCard.className = "section-card";
                secCard.innerHTML = `
                    <div class="section-header">
                        <div class="section-title">${section.title}</div>
                        <span class="section-badge">${completedInSection} / ${section.items.length} готово</span>
                    </div>
                    <div class="items-list" id="sec-list-${sIdx}"></div>
                `;

                const listDiv = secCard.querySelector(".items-list");

                filtered.forEach(item => {
                    const row = document.createElement("div");
                    row.className = `item-row ${item.isChecked ? "completed" : ""}`;

                    let badgesHtml = item.badges.map(b => `<span class="badge ${b.class}">${b.text}</span>`).join(" ");

                    let sublinesHtml = "";
                    if (item.sublines.length > 0) {
                        sublinesHtml = item.sublines.map(s => `<div class="item-subtext">${s}</div>`).join("");
                    }

                    row.innerHTML = `
                        <input type="checkbox" class="custom-checkbox" id="chk-${item.lineIndex}" ${item.isChecked ? "checked" : ""} onchange="toggleItem(${item.lineIndex}, this)">
                        <div class="item-body">
                            <div class="item-top">
                                <label for="chk-${item.lineIndex}" class="item-name" style="cursor:pointer">${item.name}</label>
                                ${badgesHtml}
                            </div>
                            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ""}
                            ${sublinesHtml}
                        </div>
                    `;
                    listDiv.appendChild(row);
                });

                container.appendChild(secCard);
            });

            // If active filter has no matches in this applicant's file
            if (totalRenderedSections === 0 && activeFilters.size > 0) {
                const noMatchDiv = document.createElement("div");
                noMatchDiv.className = "no-matches";
                noMatchDiv.innerText = "🔍 В этом пакете нет документов, соответствующих выбранным фильтрам.";
                container.appendChild(noMatchDiv);
            }

            const percent = totalItems > 0 ? Math.round((totalDone / totalItems) * 100) : 0;
            document.getElementById("progress-bar").style.width = percent + "%";
            document.getElementById("progress-text").innerText = `${percent}% (${totalDone} из ${totalItems} готово)`;
            document.getElementById("progress-label").innerText = `Готовность: ${app.title}`;
        }

        window.addEventListener("DOMContentLoaded", async () => {
            try {
                const savedDir = await getHandle("last_folder");
                if (savedDir) {
                    rootDirectoryHandle = savedDir;
                    const perm = await savedDir.queryPermission({ mode: "readwrite" });
                    if (perm === "granted") {
                        await scanAndLoadDirectory(savedDir);
                    } else {
                        document.getElementById("content-area").innerHTML = `
                            <div class="empty-state" id="empty-prompt">
                                <h3>Восстановление доступа к рабочей папке</h3>
                                <p>Рабочая папка была сохранена ранее. Нажмите кнопку для подтверждения доступа в 1 клик.</p>
                                <button class="btn-action" style="margin:0 auto" onclick="restoreSavedAccess()">
                                    <span>Подтвердить доступ</span>
                                </button>
                            </div>
                        `;
                    }
                }
            } catch (e) {
                console.error("Auto-restore check error:", e);
            }
        });
    </script>
</body>
</html>
