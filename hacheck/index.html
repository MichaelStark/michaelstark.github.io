<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реестр чек-листов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Full-screen application layout */
        html, body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: stretch;
            box-sizing: border-box;
        }

        /* 3-Column Working Grid */
        .app-layout {
            width: 100%;
            max-width: 68rem;
            height: 100%;
            max-height: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 
                clamp(2.6rem, calc((100% - 24rem - 16px) / 2), 11rem) 
                minmax(0, 44rem) 
                clamp(2.6rem, calc((100% - 24rem - 16px) / 2), 11rem);
            gap: 8px;
            justify-content: center;
            box-sizing: border-box;
            align-items: stretch;
            overflow: hidden;
        }

        /* Centered Welcome / Empty State Mode */
        .app-layout.empty-state-mode {
            display: flex;
            flex-direction: column;
            max-width: 32rem;
            height: auto;
            margin: auto;
            gap: 12px;
            align-self: center;
        }

        .app-layout.empty-state-mode header {
            display: none;
        }

        /* Fixed Left Rail */
        .sidebar-left {
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            overflow-y: auto;
            max-height: 100%;
        }

        /* Fixed Right Rail */
        .sidebar-right {
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            overflow-y: auto;
            max-height: 100%;
        }

        /* Status Filters Group (Top of Right Rail) */
        .status-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            flex-shrink: 0;
        }

        .status-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            box-sizing: border-box;
            user-select: none;
            width: 100%;
            min-height: 28px;
            height: 28px;
            overflow: hidden;
            white-space: nowrap;
            gap: 5px;
        }

        .status-btn:hover {
            background-color: #334155;
            color: #fff;
            border-color: #475569;
        }

        .status-btn.active {
            background-color: #334155;
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .status-btn-icon {
            flex-shrink: 0;
            font-size: 0.85rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .status-btn-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            flex: 1 1 auto;
        }

        .sidebar-divider {
            height: 1px;
            background-color: var(--card-border);
            margin: 4px 0;
            width: 100%;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .tags-group {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px;
            width: 100%;
        }

        /* Tag Filters in Right Column Matching Badge Size & Flowing Wrapping */
        .tag-btn {
            background-color: var(--tag-bg);
            border: 1px solid var(--tag-border);
            color: var(--tag-color);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            box-sizing: border-box;
            user-select: none;
            width: auto;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.2;
        }

        .tag-btn:hover {
            filter: brightness(1.3);
            border-color: var(--tag-color);
            box-shadow: 0 0 8px var(--tag-bg);
        }

        .tag-btn.active {
            background-color: var(--tag-color);
            color: #0f172a;
            border-color: var(--tag-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            font-weight: 700;
        }

        .tag-btn-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            width: 100%;
            text-align: left;
        }

        /* Center Main Column */
        .main-column {
            width: 100%;
            min-width: 0;
            height: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        .app-footer {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 2px 0 0 0;
            user-select: none;
        }

        .footer-logo-row {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-check-icon {
            width: 15px;
            height: 15px;
            stroke: #38bdf8;
            stroke-width: 3;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.45));
        }

        .footer-brand-title {
            font-size: 0.90rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #f8fafc;
            display: inline-flex;
            align-items: center;
        }

        .footer-brand-title .brand-accent {
            color: #38bdf8;
        }

        .footer-copy-row {
            font-size: 0.69rem;
            color: #64748b;
            font-weight: 400;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .footer-author-name {
            color: #94a3b8;
            font-weight: 600;
        }

        /* Fixed Header at top of Main Column */
        header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px 14px 12px 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-height: 74px;
            max-height: 82px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-height: 30px;
            min-width: 0;
        }

        h1 { 
            font-size: 1.18rem; 
            font-weight: 700; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1 1 auto;
            min-width: 0;
        }

        #header-action {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .subtitle { 
            color: var(--text-secondary); 
            font-size: 0.8rem; 
            line-height: 1.3; 
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 1.3em;
        }

        .header-progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(51, 65, 85, 0.5);
        }

        .header-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #4ade80);
            transition: width 0.3s ease;
        }

        .btn-action {
            background: #2563eb;
            color: #fff;
            border: 1px solid #3b82f6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            white-space: nowrap;
        }

        .btn-action:hover { background: #1d4ed8; }

        .btn-disconnect {
            background: rgba(248, 113, 113, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 4px 8px;
            border-radius: 7px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-disconnect:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: #f87171;
            color: #fff;
        }

        /* Full Path Badge */
        .status-badge {
            font-size: 0.74rem;
            color: #4ade80;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(74, 222, 128, 0.08);
            padding: 3px 7px;
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.5);
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.08);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* Scrollable Content Container */
        #content-area {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 2px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Clean Dark Scrollbars */
        #content-area::-webkit-scrollbar,
        .sidebar-left::-webkit-scrollbar,
        .sidebar-right::-webkit-scrollbar {
            width: 6px;
        }
        #content-area::-webkit-scrollbar-track,
        .sidebar-left::-webkit-scrollbar-track,
        .sidebar-right::-webkit-scrollbar-track {
            background: transparent;
        }
        #content-area::-webkit-scrollbar-thumb,
        .sidebar-left::-webkit-scrollbar-thumb,
        .sidebar-right::-webkit-scrollbar-thumb {
            background-color: var(--card-border);
            border-radius: 3px;
        }

        /* 2-Row Vertical Tab: Icon+Name on Row 1, Counter on Row 2 */
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            min-height: 46px;
            height: 46px;
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .tab-btn:hover {
            background-color: #334155;
            color: #fff;
            border-color: #475569;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 4px 12px 0 rgba(37, 99, 235, 0.35);
        }

        .tab-top-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            width: 100%;
            min-width: 0;
        }

        .tab-icon {
            flex-shrink: 0;
            font-size: 1rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tab-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            flex: 1 1 auto;
            text-align: left;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .tab-bottom-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }

        .tab-count {
            background-color: rgba(255, 255, 255, 0.12);
            padding: 1px 5px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
        }

        /* Sections & Checklists */
        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .section-header {
            padding: 9px 14px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title { font-size: 0.94rem; font-weight: 600; }
        .section-badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 5px; background-color: #334155; color: #cbd5e1; }

        .items-list { padding: 2px 0; }

        .item-row {
            padding: 9px 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            transition: background-color 0.15s ease;
        }

        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background-color: rgba(255, 255, 255, 0.02); }
        .item-row.completed { background-color: rgba(74, 222, 128, 0.04); }
        .item-row.completed .item-name { text-decoration: line-through; color: #64748b; }

        .custom-checkbox {
            margin-top: 2px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #38bdf8;
            flex-shrink: 0;
        }

        .item-body { 
            flex-grow: 1; 
            min-width: 0;
        }

        /* Clean Top Row: Name on Left, Badges on Right */
        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }

        .item-name-wrap {
            flex: 1 1 auto;
            min-width: 0;
        }

        .item-name { 
            font-weight: 600; 
            font-size: 0.90rem; 
            color: var(--text-primary); 
            line-height: 1.35;
        }

        .item-badges-wrap {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        /* Dynamic Palette Badges */
        .badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            line-height: 1.2;
            white-space: nowrap;
            background-color: var(--tag-bg);
            color: var(--tag-color);
            border: 1px solid var(--tag-border);
        }

        .item-desc { color: var(--text-secondary); font-size: 0.82rem; margin-top: 2px; line-height: 1.35; }
        .item-subtext {
            margin-top: 4px;
            padding: 4px 8px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 6px;
            font-size: 0.78rem;
            color: #cbd5e1;
            border-left: 2px solid #38bdf8;
        }

        .empty-state {
            background-color: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 36px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .empty-state h3 { font-size: 1.15rem; margin-bottom: 8px; color: #fff; font-weight: 700; }
        .empty-state p { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 20px; line-height: 1.45; }

        .no-matches {
            background-color: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
            padding: 28px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <div class="app-layout empty-state-mode" id="app-layout">
        <!-- Fixed Left Rail -->
        <aside class="sidebar-left" id="tabs-container" style="display:none"></aside>

        <!-- Center Main Column -->
        <main class="main-column">
            <header id="main-header">
                <div class="header-top-row">
                    <h1 id="main-title">Реестр документов</h1>
                    <div id="header-action"></div>
                </div>
                <p class="subtitle" id="main-subtitle"></p>
                <div class="header-progress-track" id="header-progress-track" style="display:none">
                    <div id="progress-bar" class="header-progress-fill"></div>
                </div>
            </header>

            <!-- Scrollable Content Area: Only this scrolls! -->
            <div id="content-area">
                <div class="empty-state" id="empty-prompt">
                    <h3>Подключение рабочей папки</h3>
                    <p>Нажмите кнопку ниже и выберите рабочую папку. Движок автоматически просканирует подпапки на наличие списков документов.</p>
                    <button class="btn-action" style="margin:0 auto" onclick="requestFolderAccess()">
                        <span>Выбрать рабочую папку</span>
                    </button>
                </div>
            </div>

            <!-- Centered Footer: Pure Vector Logo + Detailed Copyright -->
            <footer class="app-footer">
                <div class="footer-logo-row">
                    <svg class="footer-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span class="footer-brand-title">Ha<span class="brand-accent">Check</span></span>
                </div>
                <div class="footer-copy-row">
                    <span>&copy; 2026</span>
                    <span class="footer-author-name">Mikhail Tsiuzhou</span>
                    <span>•</span>
                    <span>Все права защищены</span>
                </div>
            </footer>
        </main>

        <!-- Fixed Right Rail -->
        <aside class="sidebar-right" id="tags-sidebar" style="display:none">
            <div class="status-group">
                <button class="status-btn active" id="seg-all" onclick="setStatusFilter('all')" title="Все">
                    <span class="status-btn-text">Все</span>
                </button>
                <button class="status-btn" id="seg-uncompleted" onclick="setStatusFilter('uncompleted')" title="Не готово">
                    <span class="status-btn-icon">⏳</span>
                    <span class="status-btn-text">Не готово</span>
                </button>
                <button class="status-btn" id="seg-completed" onclick="setStatusFilter('completed')" title="Готово">
                    <span class="status-btn-icon">✅</span>
                    <span class="status-btn-text">Готово</span>
                </button>
            </div>
            <div class="sidebar-divider" id="tags-divider" style="display:none"></div>
            <div class="tags-group" id="tags-group"></div>
        </aside>
    </div>

    <script>
        const DB_NAME = "ChecklistEngineDB";
        const STORE_NAME = "workspace_handles";

        // Base 8 HSL Hues for primary cycle
        const BASE_HUES = [155, 199, 45, 330, 243, 187, 25, 275]; // Emerald, Sky, Amber, Pink, Indigo, Cyan, Orange, Purple
        const CYCLE_HUE_SHIFT = 23; // Progressive hue rotation per extra cycle

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => {
                    req.result.createObjectStore(STORE_NAME);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveHandle(key, handle) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put(handle, key);
            } catch (e) {
                console.error("IndexedDB save error:", e);
            }
        }

        async function getHandle(key) {
            try {
                const db = await openDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, "readonly");
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        }

        async function clearHandle(key) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).delete(key);
            } catch (e) {
                console.error("IndexedDB delete error:", e);
            }
        }

        function getDisplayPath(dirHandle) {
            if (window.location.protocol === "file:") {
                try {
                    let path = decodeURIComponent(window.location.pathname);
                    if (path.startsWith("/") && path.length > 2 && path[2] === ":") {
                        path = path.substring(1);
                    }
                    const lastSlash = path.lastIndexOf("/");
                    if (lastSlash !== -1) {
                        path = path.substring(0, lastSlash);
                    }
                    return path.replace(/\//g, "\\");
                } catch (e) {}
            }
            return dirHandle ? ("/" + dirHandle.name) : "Pobyt";
        }

        let rootDirectoryHandle = null;
        let applicantsData = {};
        let currentApplicantKey = null;
        let activeStatusFilter = "all";
        let activeTagFilters = new Set();
        let globalAllTags = [];

        // Progressive Hue-Shift Palette Generator
        function getTagInlineStyle(tagLower) {
            let index = globalAllTags.indexOf(tagLower);
            if (index === -1) {
                let hash = 0;
                for (let i = 0; i < tagLower.length; i++) hash += tagLower.charCodeAt(i);
                index = Math.abs(hash);
            }

            const cycle = Math.floor(index / BASE_HUES.length);
            const baseIndex = index % BASE_HUES.length;
            // Progressive shift: each new cycle rotates hue forward by CYCLE_HUE_SHIFT degrees
            const hue = (BASE_HUES[baseIndex] + (cycle * CYCLE_HUE_SHIFT)) % 360;

            return `style="--tag-bg: hsla(${hue}, 80%, 55%, 0.16); --tag-color: hsl(${hue}, 88%, 74%); --tag-border: hsla(${hue}, 80%, 55%, 0.38); --tag-active-bg: hsl(${hue}, 85%, 52%);"`;
        }

        async function requestFolderAccess() {
            try {
                if (window.showDirectoryPicker) {
                    const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
                    rootDirectoryHandle = dirHandle;
                    await saveHandle("last_folder", dirHandle);
                    await scanAndLoadDirectory(dirHandle);
                } else {
                    alert("Ваш браузер не поддерживает File System Access API. Рекомендуется Chrome или Edge.");
                }
            } catch (err) {
                console.log("Выбор папки отменен:", err);
            }
        }

        async function restoreSavedAccess() {
            if (rootDirectoryHandle) {
                const perm = await rootDirectoryHandle.requestPermission({ mode: "readwrite" });
                if (perm === "granted") {
                    await scanAndLoadDirectory(rootDirectoryHandle);
                }
            }
        }

        async function disconnectFolder() {
            await clearHandle("last_folder");
            localStorage.removeItem("active_tab");
            rootDirectoryHandle = null;
            applicantsData = {};
            currentApplicantKey = null;
            activeStatusFilter = "all";
            activeTagFilters.clear();
            globalAllTags = [];

            document.getElementById("app-layout").classList.add("empty-state-mode");
            document.getElementById("main-title").innerText = "Реестр документов";
            document.getElementById("main-subtitle").innerText = "";
            document.getElementById("tabs-container").style.display = "none";
            document.getElementById("tags-sidebar").style.display = "none";
            document.getElementById("header-progress-track").style.display = "none";
            document.getElementById("header-action").innerHTML = "";
            document.getElementById("content-area").innerHTML = `
                <div class="empty-state" id="empty-prompt">
                    <h3>Подключение рабочей папки</h3>
                    <p>Нажмите кнопку ниже и выберите рабочую папку. Движок автоматически просканирует подпапки на наличие списков документов.</p>
                    <button class="btn-action" style="margin:0 auto" onclick="requestFolderAccess()">
                        <span>Выбрать рабочую папку</span>
                    </button>
                </div>
            `;
        }

        async function scanAndLoadDirectory(dirHandle) {
            applicantsData = {};
            globalAllTags = [];

            function registerGlobalTag(tLower) {
                if (!globalAllTags.includes(tLower)) {
                    globalAllTags.push(tLower);
                }
            }

            // 1. Root hacheck.md if exists
            try {
                const rootFileHandle = await dirHandle.getFileHandle("checklist.md", { create: false });
                const file = await rootFileHandle.getFile();
                const text = await file.text();
                const parsed = parseMarkdown(text);
                parsed.allTags.forEach(t => registerGlobalTag(t.toLowerCase()));

                applicantsData["_root"] = {
                    key: "_root",
                    title: parsed.title || dirHandle.name,
                    subtitle: parsed.subtitle || "",
                    fileHandle: rootFileHandle,
                    rawMarkdown: text,
                    sections: parsed.sections,
                    allTags: parsed.allTags
                };
            } catch (e) {}

            // 2. All non-hidden subfolders (depth 1)
            for await (const entry of dirHandle.values()) {
                if (entry.kind === "directory" && !entry.name.startsWith(".")) {
                    try {
                        const fileHandle = await entry.getFileHandle("checklist.md", { create: false });
                        const file = await fileHandle.getFile();
                        const text = await file.text();
                        const parsed = parseMarkdown(text);
                        parsed.allTags.forEach(t => registerGlobalTag(t.toLowerCase()));

                        applicantsData[entry.name] = {
                            key: entry.name,
                            title: parsed.title || entry.name,
                            subtitle: parsed.subtitle || "",
                            fileHandle: fileHandle,
                            rawMarkdown: text,
                            sections: parsed.sections,
                            allTags: parsed.allTags
                        };
                    } catch (e) {}
                }
            }

            const keys = Object.keys(applicantsData);
            if (keys.length > 0) {
                document.getElementById("app-layout").classList.remove("empty-state-mode");
                document.getElementById("empty-prompt") && (document.getElementById("empty-prompt").style.display = "none");
                document.getElementById("tabs-container").style.display = "flex";
                document.getElementById("tags-sidebar").style.display = "flex";
                document.getElementById("header-progress-track").style.display = "block";

                const fullPath = getDisplayPath(dirHandle);
                document.getElementById("header-action").innerHTML = `
                    <div class="status-badge" title="${fullPath}">
                        <span>📂</span>
                        <span>${fullPath}</span>
                    </div>
                    <button class="btn-disconnect" onclick="disconnectFolder()" title="Очистить память и выбрать другую папку">
                        <span>✕</span>
                        <span>Отвязать</span>
                    </button>
                `;

                const savedTab = localStorage.getItem("active_tab");
                currentApplicantKey = (savedTab && applicantsData[savedTab]) ? savedTab : keys[0];

                renderTabs();
                renderCurrentApplicant();
            } else {
                alert("В выбранной папке не найдены файлы checklist.md.");
            }
        }

        function stripOuterParentheses(str) {
            if (!str) return "";
            str = str.trim();
            if (!str.startsWith("(") || !str.endsWith(")")) return str;

            let depth = 0;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '(') depth++;
                else if (str[i] === ')') depth--;

                if (depth === 0 && i < str.length - 1) {
                    return str;
                }
            }

            if (depth === 0) {
                return str.slice(1, -1).trim();
            }
            return str;
        }

        function parseMarkdown(mdText) {
            const lines = mdText.split(/\r?\n/);
            const sections = [];
            let currentSection = { title: "Документы", items: [] };
            let title = "";
            let subtitle = "";
            const allTagsSet = new Set();

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith("# ") && !title) {
                    title = line.replace("# ", "").trim();
                    continue;
                }
                if ((line.startsWith("**") || line.startsWith("> ") || line.startsWith("Статус:")) && !subtitle && !line.startsWith("- ")) {
                    subtitle = line.replace(/\*\*/g, "").replace(/^>\s*/, "").trim();
                    continue;
                }
                if (line.startsWith("### ") || line.startsWith("## ")) {
                    if (currentSection.items.length > 0) {
                        sections.push(currentSection);
                    }
                    currentSection = {
                        title: line.replace(/^#+\s*/, "").trim(),
                        items: []
                    };
                    continue;
                }

                const match = line.match(/^(\s*)[\-\*\+]\s*\\?\[([ xX])\\?\]\s*(.*)$/);
                if (match) {
                    const isChecked = match[2].toLowerCase() === 'x';
                    let fullText = match[3].trim();

                    const tags = [];
                    const badges = [];
                    const tagMatches = fullText.match(/(?:^|\s)#([a-zA-Z0-9а-яА-ЯёЁ_\-]+)/g);
                    if (tagMatches) {
                        tagMatches.forEach(rawTag => {
                            const cleanTag = rawTag.trim().replace(/^#/, "");
                            const tagLower = cleanTag.toLowerCase();
                            if (cleanTag && !tags.includes(tagLower)) {
                                tags.push(tagLower);
                                allTagsSet.add(tagLower);
                                badges.push({
                                    text: cleanTag.toUpperCase(),
                                    tagLower: tagLower
                                });
                            }
                        });
                        fullText = fullText.replace(/(?:^|\s)#[a-zA-Z0-9а-яА-ЯёЁ_\-]+/g, " ").replace(/\s{2,}/g, " ").trim();
                    }

                    let name = fullText;
                    let desc = "";
                    const boldMatch = fullText.match(/^\*\*(.*?)\*\*(.*)$/);
                    if (boldMatch) {
                        name = boldMatch[1].trim();
                        desc = stripOuterParentheses(boldMatch[2].trim().replace(/^[\-:]\s*/, ""));
                    }

                    const item = {
                        lineIndex: i,
                        isChecked,
                        name,
                        desc,
                        badges,
                        tags,
                        sublines: []
                    };

                    while (i + 1 < lines.length && lines[i + 1].match(/^\s{2,}-\s+/)) {
                        i++;
                        item.sublines.push(lines[i].replace(/^\s+-\s+/, "").trim());
                    }

                    currentSection.items.push(item);
                }
            }

            if (currentSection.items.length > 0) {
                sections.push(currentSection);
            }

            return { title, subtitle, sections, allTags: Array.from(allTagsSet) };
        }

        // Render 2-Row Vertical Tabs (Left Column)
        function renderTabs() {
            const container = document.getElementById("tabs-container");
            container.innerHTML = "";

            Object.keys(applicantsData).forEach(key => {
                const app = applicantsData[key];
                let total = 0, done = 0;
                app.sections.forEach(s => {
                    s.items.forEach(i => {
                        total++;
                        if (i.isChecked) done++;
                    });
                });

                let title = app.title || key;
                let icon = "";
                let text = title;

                const emojiMatch = title.match(/^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*|\S+)\s*(.*)$/u);
                if (emojiMatch && emojiMatch[2]) {
                    icon = emojiMatch[1];
                    text = emojiMatch[2];
                }

                const btn = document.createElement("button");
                btn.className = `tab-btn ${key === currentApplicantKey ? "active" : ""}`;
                btn.onclick = () => switchApplicant(key);
                btn.title = `${title} (${done}/${total})`;

                btn.innerHTML = `
                    <div class="tab-top-row">
                        ${icon ? `<span class="tab-icon">${icon}</span>` : ''}
                        <span class="tab-text">${text}</span>
                    </div>
                    <div class="tab-bottom-row">
                        <span class="tab-count">${done}/${total}</span>
                    </div>
                `;

                container.appendChild(btn);
            });
        }

        function switchApplicant(key) {
            currentApplicantKey = key;
            localStorage.setItem("active_tab", key);
            renderTabs();
            renderCurrentApplicant();
        }

        // Status Filter Handler
        function setStatusFilter(status) {
            activeStatusFilter = status;
            document.querySelectorAll(".status-btn").forEach(btn => btn.classList.remove("active"));
            const activeBtn = document.getElementById(`seg-${status}`);
            if (activeBtn) activeBtn.classList.add("active");
            renderCurrentApplicant();
        }

        // Tag Filters Handler (Right Column)
        function toggleTagFilter(tagLower) {
            if (activeTagFilters.has(tagLower)) {
                activeTagFilters.delete(tagLower);
            } else {
                activeTagFilters.add(tagLower);
            }
            renderCurrentApplicant();
        }

        function renderTagSidebar() {
            const container = document.getElementById("tags-group");
            const divider = document.getElementById("tags-divider");
            if (!container) return;

            if (globalAllTags.length > 0) {
                divider && (divider.style.display = "block");
                let html = "";
                globalAllTags.forEach(tagLower => {
                    const isActive = activeTagFilters.has(tagLower);
                    const inlineStyle = getTagInlineStyle(tagLower);
                    const displayTag = tagLower.toUpperCase();
                    html += `
                        <button class="tag-btn ${isActive ? 'active' : ''}" ${inlineStyle} onclick="toggleTagFilter('${tagLower}')" title="Фильтр: ${displayTag}">
                            <span class="tag-btn-text">${displayTag}</span>
                        </button>
                    `;
                });
                container.innerHTML = html;
            } else {
                divider && (divider.style.display = "none");
                container.innerHTML = "";
            }
        }

        async function toggleItem(lineIndex, checkbox) {
            if (!currentApplicantKey || !applicantsData[currentApplicantKey]) return;
            const app = applicantsData[currentApplicantKey];
            const lines = app.rawMarkdown.split(/\r?\n/);

            if (lines[lineIndex]) {
                if (checkbox.checked) {
                    lines[lineIndex] = lines[lineIndex].replace(/([\-\*\+]\s*\\?\[)\s*(\\?\])/, "$1x$2");
                } else {
                    lines[lineIndex] = lines[lineIndex].replace(/([\-\*\+]\s*\\?\[)[xX](\\?\])/, "$1 $2");
                }
                app.rawMarkdown = lines.join("\n");

                if (app.fileHandle) {
                    try {
                        const writable = await app.fileHandle.createWritable();
                        await writable.write(app.rawMarkdown);
                        await writable.close();
                    } catch (err) {
                        console.error("Ошибка записи файла:", err);
                    }
                }

                const parsed = parseMarkdown(app.rawMarkdown);
                app.sections = parsed.sections;
                app.allTags = parsed.allTags;
                renderTabs();
                renderCurrentApplicant();
            }
        }

        function renderCurrentApplicant() {
            if (!currentApplicantKey || !applicantsData[currentApplicantKey]) return;
            const app = applicantsData[currentApplicantKey];

            const mainTitleEl = document.getElementById("main-title");
            const mainSubtitleEl = document.getElementById("main-subtitle");

            const fullTitle = app.title || "Реестр документов";
            const fullSubtitle = app.subtitle || "";

            mainTitleEl.innerText = fullTitle;
            mainTitleEl.title = fullTitle;

            mainSubtitleEl.innerText = fullSubtitle;
            mainSubtitleEl.title = fullSubtitle;

            renderTagSidebar();

            const container = document.getElementById("content-area");
            container.innerHTML = "";

            let totalItems = 0;
            let totalDone = 0;
            let totalRenderedSections = 0;

            const selectedTags = Array.from(activeTagFilters);

            app.sections.forEach((section, sIdx) => {
                const filtered = section.items.filter(item => {
                    totalItems++;
                    if (item.isChecked) totalDone++;

                    if (activeStatusFilter === "uncompleted" && item.isChecked) return false;
                    if (activeStatusFilter === "completed" && !item.isChecked) return false;

                    if (selectedTags.length > 0) {
                        const hasMatchingTag = selectedTags.some(t => item.tags.includes(t));
                        if (!hasMatchingTag) return false;
                    }

                    return true;
                });

                if (filtered.length === 0 && (activeStatusFilter !== "all" || selectedTags.length > 0)) return;

                totalRenderedSections++;
                const completedInSection = section.items.filter(i => i.isChecked).length;

                const secCard = document.createElement("div");
                secCard.className = "section-card";
                secCard.innerHTML = `
                    <div class="section-header">
                        <div class="section-title" title="${section.title}">${section.title}</div>
                        <span class="section-badge">${completedInSection} / ${section.items.length} готово</span>
                    </div>
                    <div class="items-list" id="sec-list-${sIdx}"></div>
                `;

                const listDiv = secCard.querySelector(".items-list");

                filtered.forEach(item => {
                    const row = document.createElement("div");
                    row.className = `item-row ${item.isChecked ? "completed" : ""}`;

                    let badgesHtml = item.badges.map(b => {
                        const inlineStyle = getTagInlineStyle(b.tagLower);
                        return `<span class="badge" ${inlineStyle} title="Лейбл: ${b.text}">${b.text}</span>`;
                    }).join(" ");

                    let sublinesHtml = "";
                    if (item.sublines.length > 0) {
                        sublinesHtml = item.sublines.map(s => `<div class="item-subtext" title="${s}">${s}</div>`).join("");
                    }

                    row.innerHTML = `
                        <input type="checkbox" class="custom-checkbox" id="chk-${item.lineIndex}" ${item.isChecked ? "checked" : ""} onchange="toggleItem(${item.lineIndex}, this)">
                        <div class="item-body">
                            <div class="item-top">
                                <div class="item-name-wrap">
                                    <label for="chk-${item.lineIndex}" class="item-name" style="cursor:pointer" title="${item.name}">${item.name}</label>
                                </div>
                                ${badgesHtml ? `<div class="item-badges-wrap">${badgesHtml}</div>` : ""}
                            </div>
                            ${item.desc ? `<div class="item-desc" title="${item.desc}">${item.desc}</div>` : ""}
                            ${sublinesHtml}
                        </div>
                    `;
                    listDiv.appendChild(row);
                });

                container.appendChild(secCard);
            });

            if (totalRenderedSections === 0 && (activeStatusFilter !== "all" || selectedTags.length > 0)) {
                const noMatchDiv = document.createElement("div");
                noMatchDiv.className = "no-matches";
                noMatchDiv.innerText = "🔍 В этом пакете нет документов, соответствующих выбранным фильтрам.";
                container.appendChild(noMatchDiv);
            }

            const percent = totalItems > 0 ? Math.round((totalDone / totalItems) * 100) : 0;
            document.getElementById("progress-bar").style.width = percent + "%";
        }

        window.addEventListener("DOMContentLoaded", async () => {
            try {
                const savedDir = await getHandle("last_folder");
                if (savedDir) {
                    rootDirectoryHandle = savedDir;
                    const perm = await savedDir.queryPermission({ mode: "readwrite" });
                    if (perm === "granted") {
                        await scanAndLoadDirectory(savedDir);
                    } else {
                        document.getElementById("app-layout").classList.add("empty-state-mode");
                        document.getElementById("content-area").innerHTML = `
                            <div class="empty-state" id="empty-prompt">
                                <h3>Восстановление доступа к рабочей папке</h3>
                                <p>Рабочая папка была сохранена ранее. Нажмите кнопку для подтверждения доступа в 1 клик.</p>
                                <button class="btn-action" style="margin:0 auto" onclick="restoreSavedAccess()">
                                    <span>Подтвердить доступ</span>
                                </button>
                            </div>
                        `;
                    }
                } else {
                    document.getElementById("app-layout").classList.add("empty-state-mode");
                }
            } catch (e) {
                console.error("Auto-restore check error:", e);
                document.getElementById("app-layout").classList.add("empty-state-mode");
            }
        });
    </script>
</body>
</html>
